<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6FB8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Gradient Background -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#grad)" />

  <!-- Medical Cross / Pulse Icon -->
  <path d="M 50 25 C 38 10, 20 25, 32 45 L 50 65 L 68 45 C 80 25, 62 10, 50 25 Z" fill="#FFFFFF" opacity="0.25" />
  
  <path d="M 28 52 L 40 52 L 44 40 L 50 62 L 56 46 L 60 52 L 72 52" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <circle cx="50" cy="74" r="4" fill="#10B981" />
</svg>
